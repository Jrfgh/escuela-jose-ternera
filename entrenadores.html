<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Entrenadores - EFD José Ternera</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f6f9;
      color: #333;
    }
    h1, h2 {
      color: #1b4332;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    form {
      display: grid;
      gap: 10px;
      max-width: 400px;
    }
    input, select, button {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      background-color: #2d6a4f;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #1b4332;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: #fff;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #2d6a4f;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    .btn-asistencia {
      background-color: #52b788;
      padding: 5px 10px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <h1>Panel de Entrenadores</h1>
  <p>Escuela de Formación Deportiva José Ternera</p>

  <!-- Formulario para agregar nuevo deportista -->
  <div class="card">
    <h2>Registrar Nuevo Deportista</h2>
    <form id="formDeportista">
      <input type="text" id="nombre" placeholder="Nombre completo" required>
      <input type="text" id="categoria" placeholder="Categoría (ej. Sub-13, Infantil)" required>
      <input type="number" id="edad" placeholder="Edad" required>
      <input type="text" id="posicion" placeholder="Posición (ej. Delantero, Armador)" required>
      <button type="submit">Guardar Deportista</button>
    </form>
  </div>

  <!-- Tabla de deportistas -->
  <div class="card">
    <h2>Listado de Deportistas</h2>
    <table>
      <thead>
        <tr>
          <th>Categoría</th>
          <th>Nombre</th>
          <th>Edad</th>
          <th>Posición</th>
          <th>Asistencias</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaDeportistas">
        <tr>
          <td colspan="6">Cargando deportistas...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Librería Oficial de Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Conexión con Supabase
    const SUPABASE_URL = 'https://qfoqiwutfcgjuhwebmrl.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmb3Fpd3V0ZmNnanVodmVibXJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMjYwMDIsImV4cCI6MjEwMzgwMjAwMn0.q0_glCINtKQ1mUUjHaJYopTZb_WusVpGfjBO_kTXp_4';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const tablaBody = document.getElementById('tablaDeportistas');
    const form = document.getElementById('formDeportista');

    // Función para obtener y listar deportistas de la base de datos
    async function cargarDeportistas() {
      const { data, error } = await _supabase
        .from('deportistas')
        .select('*')
        .order('id', { ascending: true });

      if (error) {
        console.error('Error al cargar:', error.message);
        tablaBody.innerHTML = '<tr><td colspan="6">Error al cargar los datos.</td></tr>';
        return;
      }

      tablaBody.innerHTML = '';

      if (data.length === 0) {
        tablaBody.innerHTML = '<tr><td colspan="6">No hay deportistas registrados aún.</td></tr>';
        return;
      }

      data.forEach(deportista => {
        const fila = document.createElement('tr');
        fila.innerHTML = `
          <td>${deportista.categoria || 'N/A'}</td>
          <td>${deportista.nombre || 'Sin nombre'}</td>
          <td>${deportista.edad || 'N/A'}</td>
          <td>${deportista.posicion || 'N/A'}</td>
          <td>${deportista.asistencia || 0}</td>
          <td>
            <button class="btn-asistencia" onclick="sumarAsistencia(${deportista.id}, ${deportista.asistencia || 0})">+1 Asistencia</button>
          </td>
        `;
        tablaBody.appendChild(fila);
      });
    }

    // Guardar nuevo deportista desde el formulario
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const nombre = document.getElementById('nombre').value;
      const categoria = document.getElementById('categoria').value;
      const edad = parseInt(document.getElementById('edad').value);
      const posicion = document.getElementById('posicion').value;

      const { data, error } = await _supabase
        .from('deportistas')
        .insert([{ nombre, categoria, edad, posicion, asistencia: 0 }]);

      if (error) {
        alert('Error al guardar: ' + error.message);
      } else {
        alert('¡Deportista registrado con éxito!');
        form.reset();
        cargarDeportistas();
      }
    });

    // Aumentar contador de asistencia
    async function sumarAsistencia(id, asistenciaActual) {
      const { error } = await _supabase
        .from('deportistas')
        .update({ asistencia: asistenciaActual + 1 })
        .eq('id', id);

      if (error) {
        alert('Error al marcar asistencia: ' + error.message);
      } else {
        cargarDeportistas();
      }
    }

    // Cargar los datos al abrir la página
    document.addEventListener('DOMContentLoaded', cargarDeportistas);
  </script>
</body>
</html>
