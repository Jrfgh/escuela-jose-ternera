<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - EFD José Ternera</title>
    <style>
        :root {
            --verde: #1b7a42;
            --blanco: #ffffff;
            --rojo: #d92525;
            --gris-fondo: #f4f6f8;
            --texto: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--gris-fondo);
            color: var(--texto);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .login-box {
            background: var(--blanco);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            border-top: 5px solid var(--verde);
        }

        .login-box h2 {
            text-align: center;
            color: var(--verde);
            margin-bottom: 0.5rem;
        }

        .login-box p {
            text-align: center;
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }

        .btn-ingresar {
            width: 100%;
            background-color: var(--verde);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-ingresar:hover {
            background-color: #145930;
        }

        .volver-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: var(--rojo);
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Plataforma EFD</h2>
        <p>Escuela de Formación Deportiva José Ternera</p>
        
        <form>
            <div class="form-group">
                <label for="rol">Tipo de Usuario</label>
                <select id="rol" required>
                    <option value="deportista">Deportista / Acudiente</option>
                    <option value="entrenador">Entrenador / Administrador</option>
                </select>
            </div>

            <div class="form-group">
                <label for="usuario">Usuario / Documento</label>
                <input type="text" id="usuario" placeholder="Ingresa tu documento" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-ingresar">Ingresar</button>
        </form>

        <a href="index.html" class="volver-link">← Volver a la página principal</a>
    </div>

</body>
</html>
